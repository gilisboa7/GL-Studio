<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GL Studio | Área do cliente</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='12' fill='%23895770'/%3E%3Cg fill='none' stroke='%23F3E2A0' stroke-width='3.4' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M25.2 14.8A13 13 0 1 0 16 37H44'/%3E%3Cpath d='M17 25.5H25.5V30'/%3E%3Cpath d='M33 7V37'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  color-scheme:dark;
  --g1:#5A3849; --g2:#482C3B; --g3:#2E1A25; --kpi:rgba(98,58,79,.92); --ouro-rgb:246,231,168; --ink-rgb:255,251,228; --pill-ap-bg:rgba(0,0,0,.28); --pill-ap-c:#FBE0EC; --sw-label:rgba(0,0,0,.2);
  --bg:#4E2D3F; --side:rgba(10,5,10,.26); --surface:rgba(var(--ink-rgb),.075); --surface-2:#5E3A4D; --campo:rgba(45,22,35,.32);
  --line:rgba(var(--ink-rgb),.16); --line-2:rgba(var(--ink-rgb),.1);
  --text:#FFFBE4; --text-2:rgba(var(--ink-rgb),.78); --text-3:rgba(var(--ink-rgb),.6);
  --ouro:#F6E7A8; --malva:#895770; --erro:#FFC7C7; --ok:#DCEFCF;
  --sans:'Montserrat', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --linha:var(--line); --linha-2:var(--line-2); --tinta:var(--text); --tinta-2:var(--text-2); --papel:var(--surface); --creme:var(--text); --vinho:var(--side);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:linear-gradient(155deg,var(--g1) 0%,var(--g2) 40%,var(--g3) 100%) fixed;min-height:100vh;color:var(--text);font:14.5px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--ouro);outline-offset:2px;border-radius:8px}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.015em}
h1{font-size:clamp(24px,3vw,30px);line-height:1.15}
h2{font-size:17px;line-height:1.3}
h3{font-size:15px;line-height:1.35}
h4{font-size:14.5px}
p{margin:0}
.muted{color:var(--text-2)}
.loading{padding:60px 0;text-align:center;color:var(--text-2)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ic{width:18px;height:18px;flex:none}

/* Estrutura com menu lateral */
.layout{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:28px;padding:24px 14px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:0 10px;text-decoration:none;font-weight:600;font-size:15px}
.brand .gl{color:var(--ouro)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;text-decoration:none;color:var(--text-2);font-weight:500;font-size:14px}
.nav a:hover{color:var(--text);background:rgba(var(--ink-rgb),.04)}
.nav a.on{color:var(--text);background:rgba(var(--ink-rgb),.07)}
.nav a.on .ic{color:var(--ouro)}
.side-client{display:flex;align-items:center;gap:10px;padding:18px 12px 10px;margin-top:10px;border-top:1px solid var(--line)}
.side-client strong{display:block;font-size:13.5px;font-weight:600;line-height:1.3}
.side-client small{color:var(--text-3);font-size:12px}
.side-foot{margin-top:auto;display:flex;align-items:center;gap:2px;padding:14px 4px 0 10px;border-top:1px solid var(--line)}
.me span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.me{flex:1;justify-content:flex-start;min-width:0;font-size:13px;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-btn{border:0;background:none;color:var(--text-2);padding:8px;border-radius:8px;display:inline-flex;align-items:center;gap:6px;font-size:13px}
.icon-btn:hover{color:var(--text);background:rgba(var(--ink-rgb),.06)}
main{padding:40px clamp(18px,4vw,48px) 96px;max-width:1160px;width:100%}

/* Cabeçalhos */
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:28px}
.crumb{font-size:13px;color:var(--text-3);margin-bottom:6px;font-weight:500}
.sub{color:var(--text-2);margin-top:6px;font-size:14px}
.block-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}

/* Botões */
.btn{border:1px solid transparent;border-radius:10px;padding:10px 16px;font-weight:600;font-size:13.5px;background:none;color:var(--text);text-decoration:none;display:inline-flex;align-items:center;gap:6px;line-height:1.2}
.btn.primary{background:var(--text);color:var(--bg)}
.btn.primary:hover{opacity:.88}
.btn.ghost{border-color:var(--line)}
.btn.ghost:hover{border-color:rgba(var(--ink-rgb),.25)}
.btn.sm{padding:8px 13px;font-size:13px}
.btn.xs{padding:5px 10px;font-size:12px;border-radius:8px}
.btn.danger{color:var(--erro)}
.btn.danger-solid{background:var(--erro);color:var(--bg)}
.btn[disabled]{opacity:.55;cursor:wait}
.link{color:var(--ouro);font-weight:600;font-size:13px;text-decoration:none;border:0;background:none;padding:0}
.link:hover{text-decoration:underline}

/* Inicial do cliente: uma cor só */
.av{flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;border:1px solid rgba(var(--ouro-rgb),.35);background:rgba(var(--ouro-rgb),.06);color:var(--ouro);font-weight:600;font-size:13.5px}
.av.md{width:42px;height:42px;font-size:15px}

/* Lista de clientes */
.fichas{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.ficha{display:flex;flex-direction:column;gap:14px;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
.ficha:hover{border-color:rgba(var(--ink-rgb),.22)}
.ficha.paused{opacity:.55}
.ficha-id{display:flex;align-items:center;gap:12px;min-width:0}
.ficha-id div{min-width:0}
.ficha h3{font-size:15.5px}
.ficha-id .muted{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ficha-svc{font-size:12.5px;color:var(--text-3)}
.ficha-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid var(--line-2);padding-top:12px;margin-top:auto;font-size:12.5px}
.dot{display:inline-flex;align-items:center;gap:8px;color:var(--ouro);font-weight:500}
.dot::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ouro)}

/* Números */
.block{margin-bottom:32px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:20px}
.kpi{background:var(--kpi);padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px}
.kpi .l{font-size:12.5px;color:var(--text-2);font-weight:500}
.kpi .v{font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.delta{font-size:12px;font-weight:500}
.delta.up{color:var(--ok)} .delta.down{color:var(--erro)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:20px}
.panel > h2,.panel > h3{margin-bottom:12px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.cols .panel{margin:0}
.banner{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;border:1px solid rgba(var(--ouro-rgb),.28);background:rgba(var(--ouro-rgb),.06);color:var(--text);border-radius:12px;padding:12px 16px;margin-bottom:26px;text-decoration:none;font-size:13.5px}
.banner strong{font-weight:600}
.banner span{color:var(--ouro);font-weight:600}

.mini{list-style:none;margin:0;padding:0}
.mini li{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line-2);font-size:13.5px}
.mini li:first-child{border-top:0}
.mini .d{font-size:12.5px;color:var(--text-3);font-weight:500}
.mini .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.feed{list-style:none;margin:0;padding:0}
.feed li{padding:12px 0;border-top:1px solid var(--line-2);position:relative}
.feed li:first-child{border-top:0;padding-top:0}
.feed time{display:block;font-size:12px;color:var(--text-3);margin-bottom:3px}
.feed h4{font-size:14px}
.feed p{margin-top:4px;color:var(--text-2);font-size:13.5px}
.feed .x{position:absolute;right:0;top:10px;border:0;background:none;color:var(--erro);font-size:12px}

.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;background:rgba(var(--ink-rgb),.07);color:var(--text-2);white-space:nowrap}
.pill.st-producao{background:rgba(var(--ouro-rgb),.1);color:var(--ouro)}
.pill.st-aprovacao{background:var(--pill-ap-bg);color:var(--pill-ap-c)}
.pill.st-aprovado{background:rgba(185,212,168,.12);color:var(--ok)}
.pill.st-publicado{background:var(--text);color:var(--bg)}

/* Tabelas */
.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-bottom:20px}
table{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
th{font-size:12px;font-weight:600;color:var(--text-3);text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line-2);vertical-align:top}
tr:last-child td{border-bottom:0}
.n{text-align:right;white-space:nowrap}
td strong{font-weight:600}
td small{display:block;color:var(--text-3);font-size:12px}
.acts{white-space:nowrap;text-align:right}
.chart{position:relative;height:280px}

/* Calendário de conteúdo */
.mes{margin-bottom:28px}
.mes > h3{margin-bottom:10px;color:var(--text-2);font-size:14px}
.posts{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.post{display:grid;grid-template-columns:56px 1fr;gap:16px;padding:18px 20px;border-top:1px solid var(--line-2)}
.post:first-child{border-top:0}
.post.st-aprovacao{box-shadow:inset 3px 0 0 var(--ouro)}
.date{text-align:center}
.date .dd{display:block;font-size:24px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.date .ww{font-size:12px;color:var(--text-3)}
.post .meta{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.fmt{font-size:12px;font-weight:600;color:var(--text-3)}
.post h4{margin-bottom:6px}
.post .row{margin-top:10px}
details summary{cursor:pointer;color:var(--text-2);font-size:13px}
details p{margin-top:8px;color:var(--text-2);max-width:68ch;font-size:13.5px}
.fb{margin-top:8px;font-size:13px;background:rgba(var(--ouro-rgb),.08);color:var(--ouro);padding:8px 12px;border-radius:10px}

select{font:inherit;font-size:13px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--campo);color:var(--text)}

/* Acesso */
.dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin:0}
.dl dt{font-size:12px;color:var(--text-3)}
.dl dd{margin:3px 0 0;font-weight:500}
.invites{list-style:none;margin:14px 0 0;padding:0}
.invites li{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--line-2);font-size:13.5px}
.invites li > :last-child{margin-left:auto}
code{font:600 13.5px/1 ui-monospace,'SF Mono',Menlo,monospace;letter-spacing:.08em;color:var(--ouro);background:rgba(var(--ouro-rgb),.07);padding:6px 10px;border-radius:8px}
.toggles{list-style:none;margin:14px 0 0;padding:0}
.toggles li{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 0;border-top:1px solid var(--line-2)}
.toggles strong{display:block;font-weight:600;font-size:14px}
.toggles small{color:var(--text-3);font-size:12.5px}
.switch{appearance:none;-webkit-appearance:none;flex:none;width:42px;height:24px;border-radius:999px;background:var(--campo);border:1px solid var(--line);position:relative;cursor:pointer;margin:0;transition:background .15s}
.switch::before{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--text-2);transition:transform .15s}
.switch:checked{background:var(--ouro);border-color:var(--ouro)}
.switch:checked::before{transform:translateX(18px);background:var(--bg)}
.switch:disabled{opacity:.6}
.seg-sm{display:inline-flex;background:var(--campo);border:1px solid var(--line);border-radius:11px;padding:3px}
.seg-sm button{border:0;background:none;color:var(--text-2);font-weight:600;font-size:13px;padding:7px 14px;border-radius:8px}
.seg-sm button[aria-selected=true]{background:var(--text);color:var(--bg)}
.banner .btn{margin-left:auto}
.side-foot [data-action=logout] span{display:none}
.swatches{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.sw{position:relative;border:1px solid var(--line);border-radius:12px;padding:0;height:68px;display:flex;align-items:flex-end;text-align:left;overflow:hidden;color:var(--text)}
.sw span{display:block;width:100%;padding:6px 10px;font-size:12px;font-weight:600;background:var(--sw-label)}
.sw.detalhe{height:auto;align-items:center;gap:10px;padding:10px 12px;background:rgba(var(--ink-rgb),.04)}
.sw.detalhe::before{content:"";flex:none;width:18px;height:18px;border-radius:50%;background:var(--c)}
.sw.detalhe span{padding:0;background:none;font-weight:500}
.sw[aria-pressed=true]{border-color:var(--text);box-shadow:0 0 0 2px var(--text) inset}
.swatches.fundos{grid-template-columns:repeat(4,minmax(0,1fr))}
.sw.fundo{height:58px}
@media (max-width:560px){.swatches{grid-template-columns:repeat(2,minmax(0,1fr))}.swatches.fundos{grid-template-columns:repeat(3,minmax(0,1fr))}}
.anexos{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.thumb{display:block;width:84px;height:84px;padding:0;border-radius:10px;overflow:hidden;background:var(--surface);border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.arq{align-self:center;display:inline-flex;align-items:center;gap:6px;max-width:230px;padding:7px 11px;border-radius:10px;border:1px solid var(--line);font-size:12.5px;text-decoration:none;color:var(--text)}
.arq span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-btn{cursor:pointer}
.anexos-edit{list-style:none;margin:0 0 4px;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.lightbox{padding:14px;display:grid;gap:12px}
.lightbox img{max-width:100%;max-height:70vh;border-radius:12px;display:block;margin:0 auto}
.banner .acoes{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.banner .acoes a{color:var(--ouro);font-weight:600;text-decoration:none}
.page-head .row .ic{width:16px;height:16px}
#report{position:fixed;inset:0;z-index:60;overflow:auto;background:rgba(20,10,16,.75);padding:16px 12px 48px}
body.com-relatorio{overflow:hidden}
.rep-bar{max-width:820px;margin:0 auto 12px;display:flex;gap:8px;justify-content:flex-end;align-items:center;flex-wrap:wrap}
.rep-bar small{color:#fff;opacity:.8;margin-right:auto;font-size:12.5px}
.rep-bar .btn.ghost{color:#fff;border-color:rgba(255,255,255,.35)}
.rep-bar .btn.primary{background:#fff;color:#2A1820}
.rep-page{max-width:820px;margin:0 auto;background:#fff;color:#2A1820;border-radius:6px;padding:48px 52px;font:13.5px/1.55 var(--sans);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.rep-head{border-bottom:2px solid #895770;padding-bottom:20px;margin-bottom:28px}
.rep-brand{display:flex;align-items:center;gap:8px;color:#895770;font-weight:700;font-size:14px;margin-bottom:22px}
.rep-page h1{font-size:28px;letter-spacing:-.02em;color:#2A1820}
.rep-head p{color:#6E5A63;margin-top:4px}
.rep-page section{margin-bottom:30px}
.rep-page h2{font-size:16px;color:#895770;margin-bottom:12px}
.rep-page h3{font-size:13.5px;margin:18px 0 8px;color:#2A1820}
.rep-page p{color:#2A1820}
.r-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;break-inside:avoid}
.r-kpi{background:#F8F2F5;border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.r-kpi span{font-size:11.5px;color:#6E5A63;font-weight:500}
.r-kpi strong{font-size:20px;font-weight:600;color:#2A1820;font-variant-numeric:tabular-nums}
.r-kpi em{font-style:normal;font-size:11.5px;color:#895770;font-weight:500}
.r-destaque{margin-top:14px;padding:12px 14px;border-left:3px solid #895770;background:#FBF7F0}
.r-nota{margin-top:12px}
.rep-page .r-muted{color:#6E5A63}
.rep-page table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px;break-inside:avoid}
.rep-page th{text-align:left;color:#6E5A63;font-weight:600;border-bottom:1px solid #E6DCE1;padding:7px 8px;font-size:11.5px;background:none}
.rep-page td{border-bottom:1px solid #F0E9EC;padding:7px 8px;color:#2A1820}
.rep-page td small{color:#6E5A63;font-size:11.5px}
.rep-page .n{text-align:right}
.rep-page footer{margin-top:36px;padding-top:14px;border-top:1px solid #E6DCE1;color:#6E5A63;font-size:11.5px}
@media (max-width:640px){.rep-page{padding:28px 20px}.r-kpis{grid-template-columns:repeat(2,1fr)}}
@media print{
  @page{size:A4;margin:14mm}
  body{background:#fff!important}
  body.com-relatorio{overflow:visible!important}
  body.com-relatorio > *:not(#report){display:none!important}
  #report{position:static;background:none;padding:0;overflow:visible}
  .rep-bar{display:none}
  .rep-page{max-width:none;padding:0;border-radius:0}
}
.mtop{display:none;position:sticky;top:0;z-index:20;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;background:var(--side);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.mtop .brand{padding:0}
.mtop .icon-btn{color:var(--text);padding:8px}
.mtop .icon-btn .ic{width:22px;height:22px}
.mtop-cli{margin-left:auto;font-size:13px;color:var(--text-2);font-weight:500;max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scrim{display:none}
@media (prefers-reduced-motion:reduce){.side,.scrim{transition:none}}
.top-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.top-card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.top-card.ouro,.top-mini-item.ouro{border-color:rgba(var(--ouro-rgb),.6)}
.top-pos{position:absolute;top:12px;left:12px;z-index:2;background:var(--text);color:var(--bg);font-weight:800;font-size:15px;border-radius:999px;padding:5px 12px;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.ouro .top-pos{background:var(--ouro)}
.top-capa{aspect-ratio:1/1;background:rgba(var(--ink-rgb),.06);display:grid;place-items:center;color:var(--text-3);overflow:hidden}
.top-capa img{width:100%;height:100%;object-fit:cover;display:block}
.top-capa .ic{width:30px;height:30px}
.top-info{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}

function fieldHtml(f, val){
  const id = 'f_' + f.name, req = f.required ? 'required' : '', cls = f.half ? 'fld half' : 'fld';
  const hint = f.hint ? `<p class="hint">${f.hint}</p>` : '';
  if (f.type === 'files') {
    const lista = val || [];
    return `<div class="${cls}"><label>${f.label}</label>
      ${lista.length ? `<ul class="anexos-edit">${lista.map((a, i) => `<li><label class="check"><input type="checkbox" name="${f.name}__keep" value="${i}" checked><span>${esc(a.name)}</span></label></li>`).join('')}</ul><p class="hint" style="margin:-2px 0 8px">Desmarque o que quiser remover.</p>` : ''}
      <div class="row"><label class="btn ghost sm file-btn">${ic('foto')}<span>Fotos ou vídeos</span><input type="file" name="${f.name}__midia" accept="image/*,video/*" multiple hidden></label><label class="btn ghost sm file-btn">${ic('clipe')}<span>Arquivos</span><input type="file" name="${f.name}__arq" multiple hidden></label></div>
      <p class="hint file-sel"></p>${hint}</div>`;
  }
  if (f.type === 'checks') {
    return `<fieldset class="${cls}"><legend>${f.label}</legend><div class="checks">${f.options.map(o => { const [v, l] = Array.isArray(o) ? o : [o, o]; return `<label class="check"><input type="checkbox" name="${f.name}" value="${esc(v)}" ${(val || []).includes(v) ? 'checked' : ''}><span>${esc(l)}</span></label>`; }).join('')}</div>${hint}</fieldset>`;
  }
  let inp;
  if (f.type === 'textarea') inp = `<textarea id="${id}" name="${f.name}" rows="${f.rows || 4}" ${req} placeholder="${esc(f.placeholder || '')}">${esc(val ?? '')}</textarea>`;
  else if (f.type === 'select') inp = `<select id="${id}" name="${f.name}" ${req}>${f.options.map(o => { const [v, l] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(v)}" ${String(val ?? '') === String(v) ? 'selected' : ''}>${esc(l)}</option>`; }).join('')}</select>`;
  else if (f.type === 'month') inp = `<input id="${id}" type="month" name="${f.name}" value="${esc(val ? String(val).slice(0,7) : '')}" ${req}>`;
  else inp = `<input id="${id}" type="${f.type || 'text'}" name="${f.name}" value="${esc(val ?? '')}" ${req} ${f.step ? `step="${f.step}"` : ''} ${f.type === 'number' ? 'min="0" inputmode="decimal"' : ''} ${f.minlength ? `minlength="${f.minlength}"` : ''} placeholder="${esc(f.placeholder || '')}">`;
  return `<div class="${cls}"><label for="${id}">${f.label}</label>${inp}${hint}</div>`;
}
function readForm(form, fields, values = {}){
  const fd = new FormData(form), v = {};
  for (const f of fields) {
    if (f.type === 'checks') { v[f.name] = fd.getAll(f.name); continue; }
    if (f.type === 'files') {
      const atuais = values[f.name] || [], manter = fd.getAll(f.name + '__keep').map(Number);
      v[f.name] = {
        keep:atuais.filter((_, i) => manter.includes(i)),
        removidos:atuais.filter((_, i) => !manter.includes(i)),
        novos:[...fd.getAll(f.name + '__midia'), ...fd.getAll(f.name + '__arq')].filter(x => x instanceof File && x.size > 0)
      };
      continue;
    }
    const x = (fd.get(f.name) ?? '').toString().trim();
    if (f.type === 'number') v[f.name] = x === '' ? null : Number(x.replace(',', '.'));
    else if (f.type === 'month') v[f.name] = x ? x + '-01' : null;
    else v[f.name] = x === '' ? null : x;
  }
  return v;
}
function openForm({title, intro = '', fields, values = {}, submitLabel = 'Salvar', onSubmit}){
  dlg.innerHTML = `<form class="mform"><h2 id="modal-title">${title}</h2>${intro ? `<p class="intro">${intro}</p>` : ''}${fields.map(f => fieldHtml(f, values[f.name])).join('')}<p class="form-error" role="alert"></p><div class="actions"><button type="button" class="btn ghost" data-close>Cancelar</button><button type="submit" class="btn primary">${submitLabel}</button></div></form>`;
  const form = dlg.querySelector('form'), err = form.querySelector('.form-error'), btn = form.querySelector('[type=submit]');
  form.querySelector('[data-close]').onclick = () => dlg.close();
  form.onsubmit = async e => {
    e.preventDefault(); err.textContent = ''; btn.disabled = true;
    try { await onSubmit(readForm(form, fields, values)); dlg.close(); }
    catch (x) { err.textContent = x.message; btn.disabled = false; }
  };
  form.querySelectorAll('input[type=file]').forEach(inp => inp.onchange = () => {
    const todos = [...form.querySelectorAll('input[type=file]')].flatMap(i => [...i.files]);
    form.querySelector('.file-sel').textContent = todos.length ? `${todos.length} para enviar: ${todos.map(f => f.name).join(', ')}` : '';
  });
  dlg.showModal();
  form.querySelector('input:not([type=checkbox]),textarea,select')?.focus();
}

/* ---------- Arquivos dos conteúdos (Supabase Storage) ---------- */
const BUCKET = 'conteudos';
async function enviarArquivos(lista, pasta){
  const out = [];
  for (const f of lista) {
    if (f.size > 50 * 1024 * 1024) throw new Error(`${f.name} passa de 50 MB, o limite por arquivo.`);
    const nome = f.name.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^\w.\-]+/g, '-');
    const path = `${pasta}/${Date.now()}-${nome}`;
    const {error} = await sb.storage.from(BUCKET).upload(path, f, {contentType:f.type || undefined});
    if (error) throw new Error(`Não foi possível enviar ${f.name}: ${traduz(error.message)}`);
    out.push({path, name:f.name, type:f.type || '', size:f.size});
  }
  return out;
}
async function salvarConteudo(v, id){
  const {files, ...row} = v;
  if (!id) { const novo = await q(sb.from('content_items').insert({...row, client_id:cid(), files:[]}).select().single()); id = novo.id; }
  const enviados = await enviarArquivos(files.novos, `${cid()}/${id}`);
  if (files.removidos.length) await sb.storage.from(BUCKET).remove(files.removidos.map(a => a.path));
  await q(sb.from('content_items').update({...row, files:[...files.keep, ...enviados]}).eq('id', id));
}
function anexosHtml(i){
  if (!i.files?.length) return '';
  return `<div class="anexos">${i.files.map(a => a.type.startsWith('image/')
    ? `<button type="button" class="thumb" data-action="verImagem" data-id="${esc(a.path)}" aria-label="Ver ${esc(a.name)}"><img alt="" data-path="${esc(a.path)}"></button>`
    : `<a class="arq" data-path="${esc(a.path)}" href="#" target="_blank" rel="noopener" download="${esc(a.name)}">${ic(a.type.startsWith('video/') ? 'video' : 'clipe')}<span>${esc(a.name)}</span></a>`).join('')}</div>`;
}
async function carregarAnexos(){
  const els = [...document.querySelectorAll('#tab [data-path]')];
  if (!els.length) return;
  if (!S.urlsEm || Date.now() - S.urlsEm > 50 * 60 * 1000) { S.urls = {}; S.urlsEm = Date.now(); }
  const falta = [...new Set(els.map(e => e.dataset.path))].filter(p => !S.urls[p]);
  if (falta.length) {
    const {data} = await sb.storage.from(BUCKET).createSignedUrls(falta, 3600);
    (data || []).forEach(x => { if (x.signedUrl) S.urls[x.path] = x.signedUrl; });
  }
  els.forEach(e => { const u = S.urls[e.dataset.path]; if (!u) return; if (e.tagName === 'IMG') e.src = u; else e.href = u; });
}

/* ---------- Período (vale para todas as páginas) ---------- */
const domingo = d => { const x = new Date(d + 'T12:00'); x.setDate(x.getDate() + (7 - x.getDay()) % 7); return x.toISOString().slice(0, 10); };
function opcoesPeriodo(){
  const d = S.data, sem = new Set(serieSocial('semana').map(r => r.ref_date));
  d.content.forEach(i => sem.add(domingo(i.publish_date))); sem.add(domingo(hoje()));
  const mes = new Set([...d.social.filter(r => r.kind !== 'inicio').map(r => r.ref_date.slice(0, 7)), ...d.campaigns.map(c => c.month.slice(0, 7)), ...d.top.map(p => p.month.slice(0, 7)), ...d.content.map(i => i.publish_date.slice(0, 7)), hoje().slice(0, 7)]);
  return {semanas:[...sem].sort().reverse(), meses:[...mes].sort().reverse()};
}
function periodoGeral(){
  const P = S.per || (S.per = {}), {semanas, meses} = opcoesPeriodo();
  if (!P.modo) { const ult = S.data.social.filter(r => r.kind !== 'inicio').sort((a, b) => a.ref_date < b.ref_date ? -1 : 1).at(-1); P.modo = ult?.kind === 'semana' ? 'semana' : 'mes'; }
  if (!P.sem) P.sem = serieSocial('semana').map(r => r.ref_date).filter(x => x <= hoje()).at(-1) || domingo(hoje());
  if (!P.mes) P.mes = serieSocial('mes').map(r => r.ref_date.slice(0, 7)).at(-1) || hoje().slice(0, 7);
  if (!P.de || !P.ate) { P.ate = hoje(); P.de = addDias(hoje(), -29); }
  return {semanas, meses, P};
}
function intervalo(){
  const {P} = periodoGeral();
  if (P.modo === 'semana') return [addDias(P.sem, -6), P.sem];
  if (P.modo === 'mes') { const [y, m] = P.mes.split('-').map(Number); return [P.mes + '-01', new Date(Date.UTC(y, m, 0)).toISOString().slice(0, 10)]; }
  return [P.de, P.ate];
}
function rotuloPeriodo(){
  const {P} = periodoGeral();
  if (P.modo === 'semana') return `Semana de ${ddmm(addDias(P.sem, -6))} a ${ddmm(P.sem)}`;
  if (P.modo === 'mes') return monthLabel(P.mes + '-01');
  return `${dBR(P.de)} a ${dBR(P.ate)}`;
}
const botaoPeriodo = (label = rotuloPeriodo()) => `<button type="button" class="periodo-btn" data-action="abrirPeriodo" title="Mudar o período">${ic('conteudo')}<span>${esc(label)}</span><svg class="chev" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5 6 7.5 9 4.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>`;
function kindSocial(){
  const {P} = periodoGeral(); if (P.modo !== 'custom') return P.modo;
  const [a, b] = intervalo(); return serieSocial('semana').some(r => r.ref_date >= a && r.ref_date <= b) ? 'semana' : 'mes';
}
function socialDoPeriodo(){
  const {P} = periodoGeral(), d = S.data, [a, b] = intervalo();
  if (!d.social.some(r => r.kind !== 'inicio')) return null;
  if (P.modo !== 'custom') {
    const r = serieSocial(P.modo).filter(x => x.ref_date >= a && x.ref_date <= b).at(-1);
    return r ? {rec:r, prev:anterior(r), ref:refTxt(P.modo, anterior(r)), label:periodo(r)} : {vazio:true, label:rotuloPeriodo()};
  }
  const label = rotuloPeriodo();
  const sem = serieSocial('semana').filter(r => r.ref_date >= a && r.ref_date <= b);
  const base = sem.length ? sem : serieSocial('mes').filter(r => r.ref_date >= a && r.ref_date <= b);
  if (!base.length) return {vazio:true, label};
  const soma = k => base.reduce((x, r) => x + (+r[k] || 0), 0);
  const vals = base.filter(r => r.engagement != null);
  const inicio = d.social.filter(r => r.ref_date < a || (r.kind === 'inicio' && r.ref_date <= a)).sort((x, y) => x.ref_date < y.ref_date ? -1 : 1).at(-1);
  return {custom:true, label, inicio, n:base.length, tipo:sem.length ? (base.length > 1 ? 'semanas' : 'semana') : (base.length > 1 ? 'meses' : 'mês'),
    rec:{followers:base.at(-1).followers, reach:soma('reach'), profile_visits:soma('profile_visits'), engagement:vals.length ? vals.reduce((x, r) => x + +r.engagement, 0) / vals.length : null}};
}
function mesesDoPeriodo(){
  const {P} = periodoGeral();
  if (P.modo === 'semana') return [P.sem.slice(0, 7)];
  if (P.modo === 'mes') return [P.mes];
  const out = []; let m = P.de.slice(0, 7);
  while (m <= P.ate.slice(0, 7)) { out.push(m); const [y, mm] = m.split('-').map(Number); m = mm === 12 ? `${y + 1}-01` : `${y}-${String(mm + 1).padStart(2, '0')}`; }
  return out;
}
function mesesTrafego(){
  const {P} = periodoGeral(); let ms = mesesDoPeriodo(), rows = S.data.campaigns.filter(c => ms.includes(c.month.slice(0, 7)));
  if (P.modo === 'semana' && !rows.length) { const ult = mesesCampanha().find(m => m.slice(0, 7) <= ms[0]); if (ult) { ms = [ult.slice(0, 7)]; rows = S.data.campaigns.filter(c => c.month.startsWith(ms[0])); } }
  return {ms, rows, semana:P.modo === 'semana'};
}
function rotuloMeses(ms){
  if (ms.length === 1) return monthLabel(ms[0] + '-01');
  const nome = m => new Date(+m.slice(0, 4), +m.slice(5, 7) - 1, 1).toLocaleDateString('pt-BR', {month:'long'});
  const a = ms[0], b = ms.at(-1), txt = a.slice(0, 4) === b.slice(0, 4) ? `${nome(a)} a ${nome(b)} de ${b.slice(0, 4)}` : `${nome(a)} de ${a.slice(0, 4)} a ${nome(b)} de ${b.slice(0, 4)}`;
  return txt.charAt(0).toUpperCase() + txt.slice(1);
}

    const semanas = serieSocial('semana').filter(r => r.ref_date.startsWith(m));

    h += mr ? `<div class="r-kpis">${box('Seguidores', fmtN(mr.followers), p && mr.followers != null && p.followers != null ? `${sinal(mr.followers - p.followers)} ${ref}` : '')}${box('Contas alcançadas', fmtN(mr.reach), cmp(mr.reach, p?.reach))}${box('Impressões', fmtN(mr.impressions), cmp(mr.impressions, p?.impressions))}${box('Engajamento', fmtPct(mr.engagement), p && mr.engagement != null && p.engagement != null ? `${mr.engagement - p.engagement >= 0 ? '+' : ''}${(mr.engagement - p.engagement).toFixed(2).replace('.', ',')} p.p. ${ref}` : '')}${box('Visitas ao perfil', fmtN(mr.profile_visits), cmp(mr.profile_visits, p?.profile_visits))}${box('Cliques no link', fmtN(mr.link_clicks), cmp(mr.link_clicks, p?.link_clicks))}</div>`
      : `<p class="r-muted">O fechamento deste mês ainda não foi registrado.</p>`;
    const atual = mr || semanas.at(-1);
    if (mz && atual && mz.followers != null && atual.followers != null) h += `<p class="r-destaque">Desde o início do trabalho, em ${dBR(mz.ref_date)}, o perfil foi de ${fmtN(mz.followers)} para ${fmtN(atual.followers)} seguidores: ${sinal(atual.followers - mz.followers)} (${varPct(atual.followers, mz.followers)}).</p>`;
    if (semanas.length) h += `<h3>Semana a semana</h3><table><thead><tr><th>Semana</th><th class="n">Seguidores</th><th class="n">Alcance</th><th class="n">Engajamento</th></tr></thead><tbody>${semanas.map(r => { const a = anterior(r); return `<tr><td>${ddmm(addDias(r.ref_date, -6))} a ${ddmm(r.ref_date)}</td><td class="n">${fmtN(r.followers)}${a && a.kind !== 'inicio' && r.followers != null && a.followers != null ? ` (${sinal(r.followers - a.followers)})` : ''}</td><td class="n">${fmtN(r.reach)}</td><td class="n">${fmtPct(r.engagement)}</td></tr>`; }).join('')}</tbody></table>`;
    if (mr?.notes) h += `<p class="r-nota">${nl(mr.notes)}</p>`;
    h += `</section>`;
  }
  if (v.conteudo) {
    const doMes = d.content.filter(i => i.publish_date.startsWith(m)), pub = doMes.filter(i => i.status === 'publicado');
    const porFormato = Object.entries(pub.reduce((a, i) => { const k = i.format || 'Outro'; a[k] = (a[k] || 0) + 1; return a; }, {})).map(([f, n]) => `${n} ${f.toLowerCase()}`).join(', ');
    h += `<section><h2>Conteúdo</h2><p>${pub.length ? `${pub.length} ${pub.length > 1 ? 'conteúdos publicados' : 'conteúdo publicado'} no mês (${porFormato}).` : 'Nenhum conteúdo publicado neste mês.'}${doMes.length > pub.length ? ` Outros ${doMes.length - pub.length} estão planejados ou em andamento.` : ''}</p>
      ${pub.length ? `<table><thead><tr><th>Data</th><th>Formato</th><th>Conteúdo</th></tr></thead><tbody>${pub.map(i => `<tr><td>${ddmm(i.publish_date)}</td><td>${esc(i.format || '')}</td><td>${esc(i.title)}</td></tr>`).join('')}</tbody></table>` : ''}</section>`;
  }
  const rk = v.social ? rankingDoMes(m).slice(0, 3) : [];
  if (rk.length) h += `<section><h2>Posts mais engajados</h2><table><thead><tr><th></th><th>Post</th><th class="n">Interações</th><th class="n">Curtidas</th><th class="n">Comentários</th><th class="n">Compartilhamentos</th><th class="n">Salvamentos</th></tr></thead><tbody>${rk.map((p, i) => `<tr><td><b>${i + 1}º</b></td><td>${esc(p.title)}${p.format ? `<br><small>${esc(p.format)}${p.publish_date ? `, ${ddmm(p.publish_date)}` : ''}</small>` : ''}</td><td class="n"><b>${fmtN(interacoes(p))}</b></td><td class="n">${fmtN(p.likes)}</td><td class="n">${fmtN(p.comments)}</td><td class="n">${fmtN(p.shares)}</td><td class="n">${fmtN(p.saves)}</td></tr>`).join('')}</tbody></table></section>`;
  if (v.trafego) {
    const rows = d.campaigns.filter(x => x.month.startsWith(m));
    if (rows.length) {
      const t = totais(rows);
      h += `<section><h2>Tráfego pago</h2><div class="r-kpis">${box('Investido', fmtBRL(t.spend))}${box('Resultados', fmtN(t.results))}${box('Custo por resultado', fmtBRL(t.cpr))}${box('Impressões', fmtN(t.impressions))}${box('Cliques', fmtN(t.clicks))}${box('CTR', fmtPct(t.ctr))}</div>
        <table><thead><tr><th>Campanha</th><th class="n">Investido</th><th class="n">Resultados</th><th class="n">Custo por resultado</th></tr></thead><tbody>${rows.map(r => { const x = totais([r]); return `<tr><td>${esc(r.name)}${r.objective ? `<br><small>${esc(r.objective)}</small>` : ''}</td><td class="n">${fmtBRL(r.spend)}</td><td class="n">${fmtN(r.results)} ${esc(r.result_label || '')}</td><td class="n">${fmtBRL(x.cpr)}</td></tr>`; }).join('')}</tbody></table></section>`;
    } else h += `<section><h2>Tráfego pago</h2><p class="r-muted">Nenhuma campanha registrada neste mês.</p></section>`;
  }
  const ups = d.updates.filter(u => u.created_at.slice(0, 7) === m);
  if (ups.length) h += `<section><h2>Recados do mês</h2>${ups.map(u => `<h3>${esc(u.title)}</h3>${u.body ? `<p>${nl(u.body)}</p>` : ''}`).join('')}</section>`;

  document.getElementById('report')?.remove();
  const el = document.createElement('div');
  el.id = 'report';
  el.innerHTML = `<div class="rep-bar"><small>No botão Baixar PDF, escolha "Salvar como PDF" na janela que abrir.</small><button class="btn ghost sm" data-fechar>Fechar</button><button class="btn primary sm" data-imprimir>Baixar PDF</button></div>
    <article class="rep-page"><header class="rep-head"><div class="rep-brand">${LOGO(26)}<span>GL Studio</span></div><h1>Relatório de ${nomeMes.toLowerCase()}</h1><p>${esc(c.name)}${c.instagram ? ` ${igHandle(c)}` : ''}</p></header>${h}<footer>Relatório preparado pela GL Studio em ${dBR(hoje())}.</footer></article>`;
  document.body.appendChild(el);
  document.body.classList.add('com-relatorio');
  el.querySelector('[data-fechar]').onclick = () => { el.remove(); document.body.classList.remove('com-relatorio'); };
  el.querySelector('[data-imprimir]').onclick = () => { const t = document.title; document.title = `Relatório ${c.name} ${nomeMes}`; window.print(); setTimeout(() => document.title = t, 800); };
}

/* ---------- Roteamento ---------- */
async function loadProfile(){
  const {data} = await sb.from('profiles').select('*').eq('id', S.session.user.id).maybeSingle();
  return data;
}
async function route(){
  destroyCharts();
  if (S.recovery) return renderNewPassword();
  if (!S.session) return renderAuth();
  if (!S.profile || S.profile.id !== S.session.user.id) {
    S.profile = await loadProfile();
    if (!S.profile) S.profile = {id:S.session.user.id, role:'pending', email:S.session.user.email};
    applyTheme(S.profile.theme);
  }
  const p = location.hash.replace(/^#\/?/, '').split('/');
  if (S.profile.role === 'admin') {
    if (p[0] === 'cliente' && p[1]) return openClient(p[1], p[2] || 'geral');
    return renderClients();
  }
  if (S.profile.role === 'client' && S.profile.client_id) return openClient(S.profile.client_id, p[0] === 'painel' ? (p[1] || 'geral') : 'geral');
  renderPending();
}

/* ---------- Admin: lista de clientes ---------- */
async function renderClients(){
  S.data = null; S.client = null;
  shell(`<p class="loading">Carregando clientes…</p>`);
  try {
    const [clients, pend] = await Promise.all([
      q(sb.from('clients').select('*').order('name')),
      q(sb.from('content_items').select('client_id').eq('status', 'aprovacao'))
    ]);
    const pc = {}; pend.forEach(p => pc[p.client_id] = (pc[p.client_id] || 0) + 1);
    const ativos = clients.filter(c => c.active).length, pausados = clients.length - ativos;
    const lista = clients.filter(c => S.mostrarPausados || c.active);
    shell(`<div class="page-head"><div><h1>Clientes</h1><p class="sub">${ativos} ${ativos === 1 ? 'ativo' : 'ativos'}${pausados ? `, ${pausados} ${pausados === 1 ? 'pausado' : 'pausados'}` : ''}</p></div>
      <div class="row">${pausados ? `<button class="btn ghost sm" data-action="togglePaused">${S.mostrarPausados ? 'Esconder pausados' : 'Mostrar pausados'}</button>` : ''}<button class="btn primary" data-action="newClient">Novo cliente</button></div></div>
      ${lista.length ? `<div class="fichas">${lista.map(c => ficha(c, pc[c.id] || 0)).join('')}</div>` : emptyBox('Nenhum cliente cadastrado ainda. Cadastre o primeiro para criar o painel e gerar o convite de acesso.', ['newClient','Cadastrar cliente'])}`);
  } catch (e) { shell(errorBox(e)); }
}
function ficha(c, n){
  const rodape = n || !c.active;
  return `<a class="ficha ${c.active ? '' : 'paused'}" href="#/cliente/${c.id}/geral">
    <div class="ficha-id">${avatar(c, 'md')}<div><h3>${esc(c.name)}</h3><p class="muted">${igHandle(c) || esc(c.segment || '')}</p></div></div>
    ${c.services?.length ? `<p class="ficha-svc">${esc(c.services.join(', '))}</p>` : ''}
    ${rodape ? `<div class="ficha-foot">${n ? `<span class="dot">${n} aguardando aprovação</span>` : '<span></span>'}${c.active ? '' : '<span class="pill">Pausado</span>'}</div>` : ''}
  </a>`;
}

/* ---------- Painel de um cliente ---------- */
async function loadClientData(id){
  const adm = isAdmin(), vazio = Promise.resolve([]);
  const [client, updates, social, content, campaigns, invites, users, top] = await Promise.all([
    q(sb.from('clients').select('*').eq('id', id).single()),
    q(sb.from('updates').select('*').eq('client_id', id).order('created_at', {ascending:false})),
    q(sb.from('social_metrics').select('*').eq('client_id', id).order('ref_date')),
    q(sb.from('content_items').select('*').eq('client_id', id).order('publish_date')),
    q(sb.from('campaigns').select('*').eq('client_id', id).order('month', {ascending:false})),
    adm ? q(sb.from('invites').select('*').eq('client_id', id).order('created_at', {ascending:false})) : vazio,
    adm ? q(sb.from('profiles').select('*').eq('client_id', id).eq('role', 'client')) : vazio,
    q(sb.from('top_posts').select('*').eq('client_id', id).order('month', {ascending:false}))
  ]);
  return {client, updates, social, content, campaigns, invites, users, top};
}
async function openClient(id, tab){
  S.tab = tab;
  if (!S.data || S.client?.id !== id) {
    S.client = null; S.data = null;
    shell(`<p class="loading">Carregando painel…</p>`);
    try { S.data = await loadClientData(id); S.client = S.data.client; S.filtroMes = ''; S.mesTrafego = ''; S.visaoSocial = ''; S.mesTop = ''; S.per = {}; }
    catch (e) { return shell(errorBox(e)); }
  }
  renderClientPage();
}
async function refresh(){
  try { S.data = await loadClientData(S.client.id); S.client = S.data.client; renderClientPage(); }
  catch (e) { toast(e.message); }
}
function visibleTabs(c){
  const v = servicos(c), t = [{id:'geral', label:'Visão geral'}];
  if (v.social) t.push({id:'social', label:'Social media'});
  if (v.conteudo) t.push({id:'conteudo', label:'Conteúdo'});
  if (v.trafego) t.push({id:'trafego', label:'Tráfego'});
  if (isAdmin()) t.push({id:'acesso', label:'Acesso e dados'});
  return t;
}
function renderClientPage(){
  destroyCharts();
  const c = S.client, tabs = visibleTabs(c);
  if (!tabs.some(t => t.id === S.tab)) S.tab = 'geral';
  const atual = tabs.find(t => t.id === S.tab);
  const corpo = {geral:tabGeral, social:tabSocial, conteudo:tabConteudo, trafego:tabTrafego, acesso:tabAcesso}[S.tab]();
  shell(`<header class="page-head"><div><p class="crumb">${esc(c.name)}</p><h1>${atual.label}</h1></div>${S.tab === 'geral' ? `<div class="row"><button class="btn ghost sm" data-action="report">${ic('relatorio')}<span>Relatório do mês</span></button></div>` : ''}</header><div id="tab">${corpo}</div>`);
  desenharGraficos();
  carregarAnexos();
}

function tabGeral(){
  const {social, content, campaigns, updates} = S.data, v = servicos(S.client), adm = isAdmin();
  let h = '';
  const pend = v.conteudo ? content.filter(i => i.status === 'aprovacao').length : 0;
  if (pend && adm) h += `<div class="banner"><strong>${ic('sino')}${pend} ${pend > 1 ? 'conteúdos esperando' : 'conteúdo esperando'} aprovação do cliente.</strong><span class="acoes"><a href="${tabHref('conteudo')}">Ver conteúdos</a><a href="${waLink()}" target="_blank" rel="noopener">Avisar no WhatsApp</a></span></div>`;
  else if (pend) h += `<a class="banner" href="${tabHref('conteudo')}"><strong>${ic('sino')}${pend} ${pend > 1 ? 'conteúdos aguardam' : 'conteúdo aguarda'} sua aprovação.</strong><span>Revisar agora</span></a>`;

  const ms = mesesDoPeriodo();

  if (v.social) {
    const sp = socialDoPeriodo(), mz = marcoZero();
    h += `<section class="block"><div class="block-head"><h2>${ic('social')}Instagram</h2>${sp ? botaoPeriodo(sp.label) : ''}</div>`;
    if (!sp) h += `<p class="muted">${adm ? (mz ? 'Marco zero registrado. Os números aparecem aqui no primeiro fechamento de semana ou de mês.' : 'Nenhum registro ainda. Comece pelo marco zero na aba Social media.') : 'Os números aparecem aqui quando o primeiro fechamento for registrado.'}</p>`;
    else if (sp.vazio) h += `<p class="muted">Não há registro do Instagram para este período.</p>`;
    else if (sp.custom) {
      const ini = sp.inicio, r = sp.rec, ganho = ini && ini.followers != null && r.followers != null ? r.followers - ini.followers : null;
      h += `<div class="kpis">${kpi('Seguidores', fmtN(r.followers), ini ? delta(r.followers, ini.followers, `desde ${ddmm(ini.ref_date)}`) : '')}${kpi('Alcance', fmtN(r.reach), `<span class="delta">soma de ${sp.n} ${sp.tipo}</span>`)}${kpi('Engajamento', fmtPct(r.engagement), `<span class="delta">média do período</span>`)}${ganho != null ? kpi('Ganho no período', sinal(ganho), `<span class="delta">seguidores</span>`) : kpi('Visitas ao perfil', fmtN(r.profile_visits), `<span class="delta">soma do período</span>`)}</div>`;
    } else {
      const r = sp.rec, prev = sp.prev, ref = sp.ref;
      h += `<div class="kpis">${kpi('Seguidores', fmtN(r.followers), delta(r.followers, prev?.followers, ref))}${kpi('Alcance', fmtN(r.reach), delta(r.reach, prev?.reach, ref))}${kpi('Engajamento', fmtPct(r.engagement), deltaPts(r.engagement, prev?.engagement, ref))}${mz && mz.followers != null && r.followers != null ? kpi('Desde o início', sinal(r.followers - mz.followers), `<span class="delta">seguidores desde ${ddmm(mz.ref_date)}</span>`) : kpi('Visitas ao perfil', fmtN(r.profile_visits), delta(r.profile_visits, prev?.profile_visits, ref))}</div>`;
    }
    h += `</section>` + miniRanking(ms);
  }
  if (v.trafego) {
    const {ms:msT, rows} = mesesTrafego(), t = rows.length ? totais(rows) : null;
    h += `<section class="block"><div class="block-head"><h2>${ic('trafego')}Tráfego pago</h2>${campaigns.length ? botaoPeriodo(rotuloMeses(msT)) : ''}</div>`;
    if (S.per.modo === 'semana' && campaigns.length) h += `<p class="hint" style="margin:-6px 0 12px">O tráfego é fechado por mês, então aqui aparece o último mês fechado até esta semana.</p>`;
    h += t ? `<div class="kpis">${kpi('Investido', fmtBRL(t.spend))}${kpi('Resultados', fmtN(t.results))}${kpi('Custo por resultado', fmtBRL(t.cpr))}${kpi('Cliques', fmtN(t.clicks))}</div>`
      : `<p class="muted">${campaigns.length ? 'Nenhuma campanha registrada neste período.' : adm ? 'Nenhuma campanha registrada. Adicione na aba Tráfego.' : 'Os resultados das campanhas aparecem aqui assim que forem lançados.'}</p>`;
    h += `</section>`;
  }

  const prox = content.filter(i => i.publish_date >= hoje() && i.status !== 'publicado').slice(0, 5);
  h += `<div class="cols">`;
  if (v.conteudo) h += `<section class="panel"><div class="block-head"><h2>${ic('conteudo')}Próximas publicações</h2><a class="link" href="${tabHref('conteudo')}">Ver calendário</a></div>
    ${prox.length ? `<ul class="mini">${prox.map(i => `<li><span class="d">${dateLabel(i.publish_date)}</span><span class="t">${esc(i.title)}</span>${pill(i.status)}</li>`).join('')}</ul>` : `<p class="muted">Nada agendado para os próximos dias.</p>`}</section>`;
  h += `<section class="panel"><div class="block-head"><h2>${ic('recado')}Atualizações</h2>${adm ? `<button class="btn sm ghost" data-action="addUpdate">Escrever atualização</button>` : ''}</div>
    ${updates.length ? `<ul class="feed">${updates.slice(0, 6).map(u => `<li><time>${new Date(u.created_at).toLocaleDateString('pt-BR', {day:'2-digit', month:'long'})}</time><h4>${esc(u.title)}</h4>${u.body ? `<p>${nl(u.body)}</p>` : ''}${adm ? `<button class="x" data-action="deleteUpdate" data-id="${u.id}">Excluir</button>` : ''}</li>`).join('')}</ul>`
      : `<p class="muted">${adm ? 'Escreva um recado para o cliente: entregas da semana, próximos passos, avisos.' : 'Os recados da GL Studio aparecem aqui.'}</p>`}</section>`;
  return h + `</div>`;
}

  const rows = custom ? serieSocial(vis).filter(r => r.ref_date >= pa && r.ref_date <= pb) : serieSocial(vis);

      ${ultimo ? kpi('Engajamento', fmtPct(ultimo.engagement), deltaPts(ultimo.engagement, mz.engagement, 'desde o início')) : ''}</div></section>`;

  if (rows.length + (mz ? 1 : 0) > 1) h += `<div class="panel"><div class="chart"><canvas id="chSocial" role="img" aria-label="Seguidores e alcance por período"></canvas></div></div>`;
  const lista = [...rows].reverse().concat(mz && !custom ? [mz] : []);
  h += `<div class="table-wrap"><table><thead><tr><th>${vis === 'semana' ? 'Semana' : 'Mês'}</th><th class="n">Seguidores</th><th class="n">Alcance</th><th class="n">Impressões</th><th class="n">Engajamento</th><th class="n">Visitas ao perfil</th><th class="n">Cliques no link</th><th class="n">Posts, reels, stories</th>${adm ? '<th></th>' : ''}</tr></thead><tbody>
    ${lista.map(r => { const p = anterior(r); return `<tr class="${r.id === selId ? 'sel' : ''}"><td style="white-space:nowrap">${r.kind === 'semana' ? `${ddmm(addDias(r.ref_date, -6))} a ${ddmm(r.ref_date)}` : r.kind === 'inicio' ? `Marco zero<small>${dBR(r.ref_date)}</small>` : monthLabel(r.ref_date)}${p?.kind === 'inicio' ? '<small>vs marco zero</small>' : ''}</td>
      <td class="n">${fmtN(r.followers)}${p ? sAbs(r.followers, p.followers) : ''}</td>
      <td class="n">${fmtN(r.reach)}${p ? sPct(r.reach, p.reach) : ''}</td>
      <td class="n">${fmtN(r.impressions)}${p ? sPct(r.impressions, p.impressions) : ''}</td>
      <td class="n">${fmtPct(r.engagement)}${p ? sPp(r.engagement, p.engagement) : ''}</td>
      <td class="n">${fmtN(r.profile_visits)}${p ? sPct(r.profile_visits, p.profile_visits) : ''}</td>

function destroyCharts(){ S.charts.forEach(c => c.destroy()); S.charts = []; }
function desenharGraficos(){
  if (typeof Chart === 'undefined') return;
  Chart.defaults.font.family = "'Montserrat', system-ui, sans-serif";
  Chart.defaults.color = corTinta(.75);
  const eixos = {
    y:{position:'left', grid:{color:corTinta(.12)}, ticks:{callback:v => fmtCompact(v)}},
    y1:{position:'right', grid:{display:false}, ticks:{callback:v => fmtCompact(v)}},
    x:{grid:{display:false}}
  };
  const base = {responsive:true, maintainAspectRatio:false, interaction:{mode:'index', intersect:false}, plugins:{legend:{position:'bottom', labels:{usePointStyle:true, boxWidth:8}}}};
  const s = document.getElementById('chSocial');
  if (s) {
    const mz = marcoZero(), r = (mz && S.per?.modo !== 'custom' ? [mz] : []).concat(S.serieGrafico || []);
    S.charts.push(new Chart(s, {data:{labels:r.map(rotuloCurto), datasets:[
      {type:'line', label:'Seguidores', data:r.map(x => x.followers), borderColor:corDetalhe(), backgroundColor:corDetalhe(), tension:.3, pointRadius:3, yAxisID:'y', order:0},
      {type:'bar', label:'Alcance', data:r.map(x => x.reach), backgroundColor:corTinta(.3), borderRadius:6, yAxisID:'y1', order:1}
    ]}, options:{...base, scales:eixos}}));
  }
  const t = document.getElementById('chTrafego');
  if (t) {
    const meses = mesesCampanha().reverse();
    const tot = meses.map(m => totais(S.data.campaigns.filter(c => c.month === m)));
    S.charts.push(new Chart(t, {data:{labels:meses.map(shortMonth), datasets:[
      {type:'line', label:'Resultados', data:tot.map(x => x.results), borderColor:corDetalhe(), backgroundColor:corDetalhe(), tension:.3, pointRadius:3, yAxisID:'y1', order:0},
      {type:'bar', label:'Investido (R$)', data:tot.map(x => x.spend), backgroundColor:corTinta(.3), borderRadius:6, yAxisID:'y', order:1}
    ]}, options:{...base, scales:eixos}}));
  }
}

    };
    desenhar();
    form.onclick = e => { const b = e.target.closest('[data-modo]'); if (b) { guardar(); t.modo = b.dataset.modo; desenhar(); } if (e.target.closest('[data-close]')) dlg.close(); };
    form.onsubmit = e => { e.preventDefault(); guardar(); if (t.de > t.ate) [t.de, t.ate] = [t.ate, t.de]; S.per = t; dlg.close(); renderClientPage(); };
    dlg.onclose = null;
    dlg.showModal();
  },
  perModo(k){ S.per.modo = k; renderClientPage(); },
  menu(){ document.body.classList.toggle('menu-aberto'); },
  fecharMenu(){ document.body.classList.remove('menu-aberto'); },
  async logout(){ applyTheme(null); await sb.auth.signOut(); S.session = null; S.profile = null; S.data = null; S.client = null; history.replaceState(null, '', location.pathname); renderAuth(); },
  togglePaused(){ S.mostrarPausados = !S.mostrarPausados; renderClients(); },

  newClient(){
    openForm({title:'Novo cliente', fields:clientFields(), values:{accent:'#895770', active:'true', services:['Social media'], tabs:['social','conteudo','trafego']}, submitLabel:'Cadastrar cliente',
      onSubmit:async v => { const c = await q(sb.from('clients').insert(normClient(v)).select().single()); toast('Cliente cadastrado'); location.hash = `#/cliente/${c.id}/acesso`; }});
  },
  editClient(){
    const c = S.client;
    openForm({title:'Editar dados do cliente', fields:clientFields(), values:{...c, tabs:abas(c), active:String(c.active), instagram:c.instagram ? '@' + c.instagram : ''},
      onSubmit:async v => { await q(sb.from('clients').update(normClient(v)).eq('id', c.id)); toast('Dados salvos'); refresh(); }});
  },
  async deleteClient(){
    const c = S.client;
    if (!confirm(`Excluir ${c.name} e todo o histórico? Não dá para desfazer.`)) return;
    try { await q(sb.from('clients').delete().eq('id', c.id)); toast('Cliente excluído'); S.data = null; location.hash = '#/clientes'; } catch (e) { toast(e.message); }
  },

  addUpdate(){
    openForm({title:'Escrever atualização', intro:'O cliente vê este recado na visão geral do painel.', fields:[{name:'title', label:'Título', required:true, placeholder:'Ex.: Calendário de novembro pronto'}, {name:'body', label:'Mensagem', type:'textarea', rows:4}], submitLabel:'Publicar atualização',
      onSubmit:async v => { await q(sb.from('updates').insert({...v, client_id:cid()})); toast('Atualização publicada'); refresh(); }});
  },
  deleteUpdate(id){ excluir('updates', id, 'Excluir esta atualização?', 'Atualização excluída'); },

  addSocial(kind){
    kind = TIPOS[kind] ? kind : (kindSocial() || 'mes');
    openForm({title:'Registrar números', intro:'No marco zero, se quiser comparar alcance e engajamento, use os números dos últimos 30 dias do Instagram.', fields:socialFields, values:{kind, ref_date:hoje()}, submitLabel:'Salvar registro',
      onSubmit:async v => { await q(sb.from('social_metrics').upsert({...v, client_id:cid()}, {onConflict:'client_id,kind,ref_date'})); if (v.kind !== 'inicio') { S.per.modo = v.kind; if (v.kind === 'semana') S.per.sem = v.ref_date; else S.per.mes = v.ref_date.slice(0, 7); } toast('Registro salvo'); refresh(); }});
  },
  editSocial(id){
    openForm({title:'Editar registro', fields:socialFields, values:byId('social', id), submitLabel:'Salvar registro',
      onSubmit:async v => { await q(sb.from('social_metrics').update(v).eq('id', id)); toast('Registro salvo'); refresh(); }});
  },
  visaoSocial(k){ S.visaoSocial = k; renderClientPage(); },
  deleteSocial(id){ excluir('social_metrics', id, 'Excluir este registro?', 'Registro excluído'); },

  addContent(){
    openForm({title:'Novo conteúdo', fields:contentFields(false), values:{publish_date:hoje(), status:'producao', format:'Post'}, submitLabel:'Salvar conteúdo',
      onSubmit:async v => { await salvarConteudo(v); toast('Conteúdo salvo'); refresh(); }});
  },
  editContent(id){
    openForm({title:'Editar conteúdo', fields:contentFields(true), values:byId('content', id), submitLabel:'Salvar conteúdo',
      onSubmit:async v => { await salvarConteudo(v, id); toast('Conteúdo salvo'); refresh(); }});
  },
  async deleteContent(id){
    const it = byId('content', id);
    if (!confirm('Excluir este conteúdo e os arquivos dele?')) return;
    try { await q(sb.from('content_items').delete().eq('id', id)); if (it?.files?.length) await sb.storage.from(BUCKET).remove(it.files.map(a => a.path)); toast('Conteúdo excluído'); refresh(); }
    catch (e) { toast(e.message); }
  },
  verImagem(p){
    const u = S.urls?.[p]; if (!u) return;
    const nome = p.split('/').pop().replace(/^\d+-/, '');
    dlg.innerHTML = `<div class="lightbox"><img src="${esc(u)}" alt=""><div class="actions"><a class="btn ghost" href="${esc(u)}" download="${esc(nome)}" target="_blank" rel="noopener">Baixar</a><button type="button" class="btn primary" data-close>Fechar</button></div></div>`;
    dlg.querySelector('[data-close]').onclick = () => dlg.close();
    dlg.showModal();
  },
  report(){
    const ms = mesesRelatorio();
    if (!ms.length) return toast('Ainda não há dados para gerar um relatório.');
    openForm({title:'Relatório do mês', intro:'Gera uma página pronta para salvar em PDF ou imprimir, com os números do mês, o comparativo e o que foi publicado.', fields:[{name:'mes', label:'Mês', type:'select', options:ms.map(m => [m, monthLabel(m + '-01')])}], values:{mes:ms[0]}, submitLabel:'Gerar relatório',
      onSubmit:async v => { setTimeout(() => abrirRelatorio(v.mes), 0); }});
  },

  async approve(id){
    if (!confirm('Aprovar este conteúdo para publicação?')) return;
    try { await q(sb.rpc('client_review_content', {p_id:id, p_approved:true, p_feedback:null})); toast('Conteúdo aprovado'); refresh(); } catch (e) { toast(e.message); }
  },
  requestChanges(id){
    openForm({title:'Pedir ajuste', intro:'Conte o que você quer mudar. A GL Studio recebe o pedido e o conteúdo volta para produção.', fields:[{name:'feedback', label:'O que ajustar', type:'textarea', rows:4, required:true}], submitLabel:'Enviar pedido de ajuste',
      onSubmit:async v => { await q(sb.rpc('client_review_content', {p_id:id, p_approved:false, p_feedback:v.feedback})); toast('Pedido de ajuste enviado'); refresh(); }});
  },

  addCampaign(){
    openForm({title:'Nova campanha', fields:campaignFields, values:{month:(mesesDoPeriodo().at(-1) || hoje().slice(0, 7)) + '-01', platform:'Meta Ads', objective:'Mensagens no WhatsApp', result_label:'Conversas'}, submitLabel:'Salvar campanha',
      onSubmit:async v => { await q(sb.from('campaigns').insert({...v, client_id:cid()})); S.per.modo = 'mes'; S.per.mes = v.month.slice(0, 7); toast('Campanha salva'); refresh(); }});
  },
  editCampaign(id){
    openForm({title:'Editar campanha', fields:campaignFields, values:byId('campaigns', id), submitLabel:'Salvar campanha',
      onSubmit:async v => { await q(sb.from('campaigns').update(v).eq('id', id)); toast('Campanha salva'); refresh(); }});
  },
  deleteCampaign(id){ excluir('campaigns', id, 'Excluir esta campanha?', 'Campanha excluída'); },

  newInvite(){
    openForm({title:'Gerar convite', intro:'Se preencher o e-mail, só essa pessoa consegue usar o convite.', fields:[{name:'email', label:'E-mail do cliente', type:'email', hint:'Opcional.'}], submitLabel:'Gerar convite',
      onSubmit:async v => { await q(sb.from('invites').insert({client_id:cid(), email:v.email})); toast('Convite gerado. Toque em Copiar link para enviar.'); refresh(); }});
  },
  async copyInvite(code){
    const link = `${location.origin}${location.pathname}?convite=${code}`;
    try { await navigator.clipboard.writeText(link); toast('Link copiado'); } catch { prompt('Copie o link do convite:', link); }
  },
  async deleteInvite(code){
    if (!confirm('Cancelar este convite? O link deixa de funcionar.')) return;
    try { await q(sb.from('invites').delete().eq('code', code)); toast('Convite cancelado'); refresh(); } catch (e) { toast(e.message); }
  },
  async revokeUser(id){
    if (!confirm('Remover o acesso desta pessoa ao painel?')) return;
    try { await q(sb.from('profiles').update({role:'pending', client_id:null}).eq('id', id)); toast('Acesso removido'); refresh(); } catch (e) { toast(e.message); }
  }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el || !actions[el.dataset.action]) return;
  e.preventDefault();
  actions[el.dataset.action](el.dataset.id, el);
});
document.addEventListener('change', e => {
  const k = e.target.dataset?.tabToggle;
  if (k) {
    const on = e.target.checked, novas = on ? [...new Set([...abas(S.client), k])] : abas(S.client).filter(x => x !== k);
    const nome = ABAS_OPC.find(a => a[0] === k)[1];
    e.target.disabled = true;
    q(sb.from('clients').update({tabs:novas}).eq('id', S.client.id))
      .then(() => { toast(`Aba ${nome} ${on ? 'ligada' : 'desligada'}`); refresh(); })
      .catch(err => { toast(err.message); e.target.checked = !on; e.target.disabled = false; });
    return;
  }
  const f = e.target.dataset?.filter;
  if (!f) return;
  if (f === 'mes') S.filtroMes = e.target.value;
  if (f === 'mesTrafego') S.mesTrafego = e.target.value;
  if (f === 'mesTop') S.mesTop = e.target.value;
  if (f === 'perSem') S.per.sem = e.target.value;
  if (f === 'perMes') S.per.mes = e.target.value;
  if (f === 'perDe' || f === 'perAte') {
    if (!e.target.value) return;
    S.per[f === 'perDe' ? 'de' : 'ate'] = e.target.value;
    if (S.per.de > S.per.ate) [S.per.de, S.per.ate] = [S.per.ate, S.per.de];
  }
  renderClientPage();
});
dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
window.addEventListener('hashchange', () => document.body.classList.remove('menu-aberto'));
document.addEventListener('keydown', e => { if (e.key === 'Escape') document.body.classList.remove('menu-aberto'); });
document.addEventListener('click', e => { if (e.target.closest('.side a, .side button')) document.body.classList.remove('menu-aberto'); });

/* ---------- Início ---------- */
(async function boot(){
  if (!configurado) return renderSetup();
  sb.auth.onAuthStateChange((ev, session) => {
    S.session = session;
    if (ev === 'PASSWORD_RECOVERY') { S.recovery = true; setTimeout(renderNewPassword, 0); }
    if (ev === 'SIGNED_OUT') { S.profile = null; S.data = null; setTimeout(() => renderAuth(), 0); }
  });
  const {data:{session}} = await sb.auth.getSession();
  S.session = session;
  if (S.recovery || location.hash.includes('type=recovery')) { S.recovery = true; return renderNewPassword(); }
  window.addEventListener('hashchange', () => { if (S.session && !location.hash.includes('access_token')) route(); });
  route();
})();
</script>
</body>
</html>
